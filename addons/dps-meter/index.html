<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark;--gold:#e5bd7b;--line:#a87848;--text:#fff0de}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:transparent;color:var(--text);font:12px 'Segoe UI',Arial,sans-serif;overflow:hidden}
.meter{position:relative;display:flex;flex-direction:column;width:100%;height:100%;background:linear-gradient(145deg,#2a2130f0,#12131cf7 74%,#0b0c14fb);border:1px solid #a47a47;border-radius:8px;box-shadow:0 14px 36px #000b,0 0 0 1px #1f1723 inset;overflow:hidden}
.meter:before{content:'';position:absolute;inset:3px;border:1px solid #d0ae7730;border-radius:5px;pointer-events:none}
.titlebar{height:40px;min-height:40px;display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;border-bottom:1px solid #bc8c53;background:linear-gradient(90deg,#39283a,#201b29);cursor:grab;touch-action:none;user-select:none}
.titlebar:active{cursor:grabbing}
.title-symbol{width:19px;height:19px;display:grid;place-items:center;border:1px solid #dab67b;transform:rotate(45deg);color:#e3bc81;flex:none;box-shadow:0 0 10px #0005}
.title-symbol span{display:block;font-size:12px;transform:rotate(-45deg)}
.title{font-size:12px;line-height:1;font-weight:800;letter-spacing:.12em;color:#f4c783;text-transform:uppercase;white-space:nowrap;text-shadow:0 1px 10px #0008}
.title-spacer{flex:1;min-width:2px}
.drag-dots{color:#d1aa78;opacity:.92;font-size:16px;line-height:1;letter-spacing:-.18em;padding-right:5px;text-shadow:0 1px 6px #0008}
.collapse{width:24px;height:24px;border:0;background:transparent;color:#e9bc7a;font-size:22px;cursor:pointer;flex:none;padding:0;display:grid;place-items:center;line-height:1}
.collapse:hover,.collapse:focus-visible{color:#fff2d4;background:#be95502a;outline:1px solid #cba46e}
.list{flex:1;min-height:0;overflow:auto;padding:9px 10px 10px 10px;scrollbar-width:thin;scrollbar-color:#826441 #211820;overscroll-behavior:contain}
.list::-webkit-scrollbar{width:6px}.list::-webkit-scrollbar-thumb{background:#775a42;border-radius:10px}.list::-webkit-scrollbar-track{background:#1a1821}
.spell-row{position:relative;display:grid;grid-template-columns:24px 20px minmax(0,1fr) auto;align-items:center;gap:7px;height:35px;margin-bottom:4px;padding:2px 8px 2px 4px;background:linear-gradient(90deg,#4a30439c,#231d2ebd);border:1px solid #7b5b436e;border-radius:4px;overflow:hidden;box-shadow:inset 0 1px 0 #ffffff10}
.spell-row:nth-child(even){background:linear-gradient(90deg,#492b3597,#221b279f)}
.spell-row:first-child{background:linear-gradient(90deg,#604271b0,#2d243ea8);border-color:#c9a6788f;box-shadow:0 0 0 1px #e6bc7a20 inset}
.spell-row .spell-icon{width:24px;height:24px;border:1px solid #a6886d63;border-radius:4px;background:linear-gradient(130deg,var(--skill-bg,#4b355b),#14151e);font-size:15px;display:grid;place-items:center;box-shadow:0 0 10px #0009 inset;line-height:1;overflow:hidden}
.spell-icon img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.rank{font-size:11px;color:var(--spell-color,#f3dbb9);font-weight:800;align-self:center;font-variant-numeric:tabular-nums;text-shadow:0 1px 5px #000b}
.spell-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:11px;color:var(--spell-color,#f9e4d6);font-weight:700;text-shadow:0 1px 6px #000b}
.damage{white-space:nowrap;text-align:right;font-size:11px;font-weight:800;color:var(--spell-color,#fff6e9);font-variant-numeric:tabular-nums;text-shadow:0 1px 6px #000c}
.damage .dps{color:var(--spell-soft,#eadcc9);font-weight:650}
.damage-bar{position:absolute;bottom:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--spell-color,#f0c184),rgba(255,255,255,.92));opacity:.95;pointer-events:none;box-shadow:0 0 8px var(--spell-color,#f0c184)}
.empty{padding:24px 12px;color:#cdbcb0;font-size:12px;text-align:center;line-height:1.6}
.grip{position:absolute;bottom:0;right:0;width:24px;height:24px;touch-action:none;cursor:nwse-resize;background:repeating-linear-gradient(135deg,transparent 0 5px,#d2a465 5px 7px,transparent 7px 10px);clip-path:polygon(100% 0,100% 100%,0 100%);opacity:.92}
.grip:hover{filter:brightness(1.4)}
@media(max-height:245px){
 .titlebar{height:34px;min-height:34px;padding-left:9px}
 .list{padding:4px 8px 4px;scrollbar-width:thin}
 .spell-row{height:24px;margin-bottom:2px;padding-top:0;padding-bottom:0;grid-template-columns:21px 15px minmax(0,1fr) auto;gap:4px}
 .spell-row .spell-icon{width:21px;height:21px;font-size:13px}
 .spell-name,.damage,.rank{font-size:10px}
 .title-symbol{width:17px;height:17px}
}
.meter.collapsed .list,.meter.collapsed .grip{display:none}
@media(max-width:360px){.title{font-size:11px;letter-spacing:.07em}.spell-name,.damage{font-size:10px}}
</style></head><body>

function compact(number){
 const n=Math.max(0,Number(number)||0);
 if(n>=1e12)return (n/1e12).toFixed(2)+'T';
 if(n>=1e9)return (n/1e9).toFixed(2)+'Md';
 if(n>=1e6)return (n/1e6).toFixed(2)+'M';
 if(n>=10000)return (n/1000).toFixed(1)+'K';
 return Math.round(n).toLocaleString('fr-FR');
}
function iconFor(key){
 const safe=typeof key==='string'&&/^(upgrade|class|talent):[a-zA-Z0-9_-]{1,60}$/.test(key)?key:'talent:skill';
 return ICONS[safe]||ICONS['talent:skill'];
}
function normalizeHex(value){
 const raw=String(value||'').trim();
 if(/^#[0-9a-fA-F]{6}$/.test(raw))return raw.toLowerCase();
 if(/^#[0-9a-fA-F]{3}$/.test(raw))return '#'+raw.slice(1).split('').map(c=>c+c).join('').toLowerCase();
 return '#f1cf9b';
}
function mixChannel(a,b,t){return Math.round(a+(b-a)*t);}
function readableColor(input){
 const hex=normalizeHex(input);const rgb=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
 let lum=(rgb[0]*0.299+rgb[1]*0.587+rgb[2]*0.114)/255;
 if(lum<0.52){
  const t=Math.min(.78,Math.max(.32,(0.62-lum)*1.45));
  rgb[0]=mixChannel(rgb[0],255,t);rgb[1]=mixChannel(rgb[1],239,t);rgb[2]=mixChannel(rgb[2],214,t);
  lum=(rgb[0]*0.299+rgb[1]*0.587+rgb[2]*0.114)/255;
 }
 if(lum>0.92){
  const t=.10;rgb[0]=mixChannel(rgb[0],235,t);rgb[1]=mixChannel(rgb[1],214,t);rgb[2]=mixChannel(rgb[2],182,t);
 }
 return '#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('');
}
function renderSpells(spells){
 const ranked=[...spells].sort((a,b)=>b.totalDamage-a.totalDamage||b.avgDps-a.avgDps||a.name.localeCompare(b.name,'fr'));
 const list=$('rows');const offset=list.scrollTop;list.replaceChildren();
 if(!spells.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Aucun dégât enregistré.';list.append(empty);return;}
 const max=Math.max(1,Number(ranked[0].totalDamage)||0);
 for(const [index,spell] of ranked.slice(0,50).entries()){
  const row=document.createElement('div');row.className='spell-row';
  const icon=document.createElement('span');icon.className='spell-icon';
  const [image,color]=iconFor(spell.icon);const tint=readableColor(color);
  const realIcon=document.createElement('img');realIcon.src=image;realIcon.alt='';realIcon.draggable=false;icon.append(realIcon);
  row.style.setProperty('--spell-color',tint);row.style.setProperty('--spell-soft',readableColor(tint));icon.style.setProperty('--skill-color',tint);
  const rank=document.createElement('span');rank.className='rank';rank.textContent=(index+1)+'.';
  const name=document.createElement('span');name.className='spell-name';name.textContent=String(spell.name||spell.id||'Autre').slice(0,75);name.title=name.textContent;
  const damage=document.createElement('span');damage.className='damage';damage.textContent=compact(spell.totalDamage)+' ';
  const dps=document.createElement('span');dps.className='dps';dps.textContent='('+compact(spell.avgDps)+'/s)';damage.append(dps);
  const bar=document.createElement('span');bar.className='damage-bar';bar.style.width=Math.max(1,Math.round((Number(spell.totalDamage)||0)/max*100))+'%';
  row.append(icon,rank,name,damage,bar);list.append(row);
 }
 list.scrollTop=offset;
}

window.addEventListener('message',event=>{
 if(event.source!==window.parent)return;
 const packet=event.data;
 if(packet?.type===WINDOW_STATE){collapsed=packet.collapsed===true;syncCollapsed();return;}
 if(packet?.type!=='ASHFALL_TELEMETRY_V2'&&packet?.type!=='ASHFALL_SNAPSHOT_V3')return;
 const data=packet.type==='ASHFALL_SNAPSHOT_V3'?packet.data?.combat:packet.data;
 if(data?.schema!==2)return;
 if(!Array.isArray(data.topSpells))return;
 if(data.runId!==lastRun){lastRun=data.runId;$('rows').scrollTop=0;}
 lastSnapshot=data;renderSpells(data.topSpells);
});
function notify(action,extra={}){window.parent.postMessage({type:WINDOW_TYPE,action,...extra},'*');}
function attachGesture(element,mode){
 let start=null;
 element.addEventListener('pointerdown',event=>{
  if(event.button!==0||event.target.closest('button')||collapsed&&mode==='resize')return;
  start={x:event.screenX,y:event.screenY,id:event.pointerId};
  element.setPointerCapture(event.pointerId);
  notify('start',{mode});event.preventDefault();
 });
 element.addEventListener('pointermove',event=>{
  if(!start||start.id!==event.pointerId)return;
  notify('move',{dx:event.screenX-start.x,dy:event.screenY-start.y});event.preventDefault();
 });
 const end=event=>{
  if(!start||start.id!==event.pointerId)return;
  start=null;notify('end');
 };
 element.addEventListener('pointerup',end);
 element.addEventListener('pointercancel',end);
 element.addEventListener('lostpointercapture',event=>{if(start&&start.id===event.pointerId){start=null;notify('end');}});
}
attachGesture($('titlebar'),'move');attachGesture($('grip'),'resize');
$('collapse').addEventListener('click',()=>{collapsed=!collapsed;syncCollapsed();notify('collapse',{collapsed});});
</script></body></html>
